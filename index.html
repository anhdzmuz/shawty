<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shawty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== ẢNH VÀ NHẠC TÙY CHỈNH =====
   Upload file cùng thư mục với index.html, đặt đúng tên (đuôi gif, png, jpg, jpeg hoặc webp đều được):
     avatar.*      ảnh đại diện
     cover.*       nền phía sau avatar (dải trên cùng của thẻ)
     background.*  nền phía sau cả thẻ
     cat.*         icon mèo ở hàng huy hiệu
   Nhạc: upload file mp3 tên  nhac.mp3  (sửa tên ở thẻ <audio> bên dưới nếu muốn).
   Chưa có file nào thì trang tự dùng màu mặc định. */
:root{
  --accent:#FF6FA5;
  --page-bg:none;
  --cover-bg:none;
}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08080E}
body{
  min-height:100vh;padding:40px 16px 56px;color:#F2F2F7;
  font-family:'Be Vietnam Pro',system-ui,sans-serif;line-height:1.55;
  background:var(--page-bg) center/cover no-repeat,radial-gradient(ellipse at 20% 0%,#2A1030 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#0F1F3A 0%,transparent 55%),#08080E;
  background-attachment:fixed;
}

/* Màn hình "Welcome" */
#gate{
  position:fixed;inset:0;z-index:50;border:none;margin:0;padding:0;cursor:pointer;
  background:#08080E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:.14em;
  transition:opacity .6s ease;
}
#gate .gate-sub{font-size:8px;letter-spacing:.2em;color:#fff}
#gate.hide{opacity:0;pointer-events:none}
#gate .gate-text{animation:gate-pulse 2s ease-in-out infinite}
@keyframes gate-pulse{0%,100%{opacity:.55}50%{opacity:1}}

/* Viền neon chạy quanh thẻ */
.frame{
  max-width:480px;margin:0 auto;padding:2px;border-radius:18px;
  background:conic-gradient(from var(--ang),#FF6FA5,#C77DFF,#8FA8FF,#FF6FA5);
  animation:frame-spin 6s linear infinite;
  box-shadow:0 0 28px rgba(255,111,165,.22);
}
@keyframes frame-spin{to{--ang:360deg}}
.card{border-radius:16px;background:#12121C;overflow:hidden}

.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.1);font-family:'JetBrains Mono',monospace;font-size:14px;color:#8C8CA0}
.bar .ctl{display:flex;gap:16px}
.spin-star{display:block;animation:star-spin 4s linear infinite}
@keyframes star-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.cover{height:132px;background:var(--cover-bg) center/cover no-repeat,linear-gradient(135deg,var(--accent) 0%,#3A1F6B 55%,#0F1F3A 100%)}
.inner{padding:0 24px 28px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:12px;margin-top:-56px;position:relative;z-index:1}

/* Vòng sáng gradient xoay quanh avatar */
.ring{position:relative;width:112px;height:112px}
.ring::before,.ring::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from var(--ang),#FF6FA5,#C77DFF,#8FA8FF,#FF6FA5);
  animation:frame-spin 4s linear infinite;
}
.ring::after{filter:blur(10px);opacity:.55}
.avatar{position:absolute;left:4px;top:4px;overflow:hidden;width:104px;height:104px;border-radius:52px;border:4px solid #12121C;background:#1E1E2E;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:var(--accent);z-index:1}
.avatar img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}

h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}
.user{font-family:'JetBrains Mono',monospace;font-size:14px;color:#A0A0B8}
.status{font-weight:600;font-size:15px;color:var(--accent);min-height:1.55em}
.status .caret{display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-.12em;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pill{padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:14px}
.pill.mono{font-family:'JetBrains Mono',monospace;font-size:13px}
.badges{display:flex;gap:6px}
.badge{width:34px;height:34px;border-radius:17px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
p{margin:0;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips .pill{padding:6px 14px}
.links{display:flex;flex-direction:column;gap:10px}
.link{
  display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  color:#F2F2F7;text-decoration:none;font-weight:500;
  -webkit-tap-highlight-color:transparent;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),border-color .2s;
}
.link span.l{flex:1}
.link span.h{font-family:'JetBrains Mono',monospace;font-size:13px;color:#A0A0B8}
.link:hover{border-color:var(--accent);transform:translateY(-2px)}
.link:active{transform:scale(.95)}
.link:focus:not(:focus-visible){outline:none}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.music{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.play{width:48px;height:48px;border-radius:24px;border:none;background:var(--accent);color:#1A0A12;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.play:active{transform:scale(.9)}
.play:focus:not(:focus-visible){outline:none}
.play:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.track{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.track b{font-weight:600;font-size:15px}
.track-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.track-head b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.music-star{width:22px;height:22px;flex:none;color:#fff;filter:drop-shadow(0 0 3px rgba(255,255,255,.95)) drop-shadow(0 0 8px rgba(255,255,255,.65));animation:star-spin 4s linear infinite}
.prog-wrap{padding:8px 0;cursor:pointer;touch-action:manipulation}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.15)}
.prog i{display:block;width:0%;height:4px;border-radius:2px;background:var(--accent)}
.time{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;color:#A0A0B8}
footer{text-align:center;font-size:12px;color:#8C8CA0;border-top:1px solid rgba(255,255,255,.1);padding-top:16px}

/* Chữ gradient chuyển động */
.gtext{
  display:inline-block;padding-bottom:.12em;
  background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:gshift 4s ease-in-out infinite;
}
@keyframes gshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.g-name{background-image:linear-gradient(90deg,#FF6FA5,#C77DFF,#8FA8FF,#C77DFF,#FF6FA5)}
.g-genshin{background-image:linear-gradient(90deg,#FFD27A,#FFF3C9,#7FD1FF,#FFF3C9,#FFD27A)}
.g-discord{background-image:linear-gradient(90deg,#6D79FF,#B4BCFF,#6D79FF,#B4BCFF,#6D79FF)}
.g-vn{background-image:linear-gradient(90deg,#FF2D2D,#FFD21F,#FF2D2D,#FFD21F,#FF2D2D);font-weight:700}
.g-tiktok{background-image:linear-gradient(90deg,#25F4EE,#FFFFFF,#FE2C55,#FFFFFF,#25F4EE)}

/* Bố cục thích ứng cho máy tính bảng, PC và điện thoại */
@media (min-width:768px){
  body{padding:36px 24px 48px}
  .frame{width:min(100%,520px)}
  .cover{height:148px}
  .inner{padding:0 30px 32px;gap:30px}
  header{margin-top:-60px}
  .ring{width:120px;height:120px}
  .avatar{left:4px;top:4px;width:112px;height:112px}
}

@media (max-width:600px){
  body{min-height:100svh;padding:24px 12px 32px}
  .frame{width:100%;max-width:480px}
  .cover{height:116px}
  .inner{padding:0 18px 22px;gap:22px}
  header{gap:10px;margin-top:-48px}
  .ring{width:100px;height:100px}
  .avatar{left:4px;top:4px;width:92px;height:92px;font-size:36px}
  h1{font-size:26px}
  .status{font-size:14px}
  p{font-size:13px}
  .link{min-height:50px;padding:0 13px}
  .music{gap:11px;padding:12px}
  .play{width:44px;height:44px}
}

@media (max-width:380px){
  body{padding:16px 8px 24px}
  .inner{padding:0 14px 18px;gap:19px}
  .bar{padding:9px 12px}
  .cover{height:104px}
  header{margin-top:-42px}
  .ring{width:88px;height:88px}
  .avatar{width:80px;height:80px;font-size:32px}
  h1{font-size:24px}
  .pill{padding:4px 10px;font-size:13px}
  .chips .pill{padding:5px 11px}
  .link{gap:9px;padding:0 11px;font-size:14px}
  .link span.h{font-size:12px}
  .track b{font-size:14px}
}

@media (prefers-reduced-motion:reduce){
  .spin-star,.music-star,.gtext,.frame,.ring::before,.ring::after,#gate .gate-text,.status .caret{animation:none}
  .link,.play,#gate{transition:none}
}
</style>
</head>

<script>
  /* Link chưa điền (href="#") thì bấm vào không làm gì, không nhảy lên đầu trang */
  document.querySelectorAll('a[href="#"]').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); });
  });

  /* Tự tìm ảnh: thử lần lượt gif, png, jpg, jpeg, webp */
  function pick(base, done) {
    var exts = ['gif', 'png', 'jpg', 'jpeg', 'webp'], i = 0;
    (function next() {
      if (i >= exts.length) return;
      var ext = exts[i++], im = new Image(), url = base + '.' + ext;
      im.onload = function () { done(url); };
      im.onerror = next;
      im.src = url;
    })();
  }
  pick('avatar', function (u) {
    var el = document.getElementById('avatar-img');
    el.src = u; el.style.display = 'block';
    el.parentNode.style.fontSize = '0'; /* ẩn chữ G khi đã có ảnh */
  });
  pick('cat', function (u) {
    document.getElementById('cat-img').src = u;
    document.getElementById('cat-badge').style.display = 'flex';
  });
  pick('cover', function (u) {
    document.documentElement.style.setProperty('--cover-bg', 'url("' + u + '")');
  });
  pick('background', function (u) {
    document.documentElement.style.setProperty('--page-bg', 'url("' + u + '")');
  });

  /* Nhạc */
  var song = document.getElementById('song');
  var playing = false;
  function showIcons() {
    document.getElementById('ico-play').style.display = playing ? 'none' : 'block';
    document.getElementById('ico-pause').style.display = playing ? 'block' : 'none';
  }
  function setPlaying(on) {
    playing = on;
    showIcons();
    if (!song) return;
    if (on) {
      var p = song.play();
      if (p && p.catch) p.catch(function () { /* chưa có file nhạc hoặc bị chặn */ });
    } else {
      song.pause();
    }
  }
  document.getElementById('play').addEventListener('click', function () { setPlaying(!playing); });

  /* Thời gian chạy theo bài hát */
  var tCur = document.getElementById('t-cur');
  var tDur = document.getElementById('t-dur');
  var fill = document.getElementById('prog-fill');
  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function updateTime() {
    var d = song.duration, c = song.currentTime;
    tCur.textContent = fmt(c);
    tDur.textContent = fmt(d);
    fill.style.width = (isFinite(d) && d > 0 ? (c / d) * 100 : 0) + '%';
  }
  ['timeupdate', 'loadedmetadata', 'durationchange', 'seeked'].forEach(function (ev) {
    song.addEventListener(ev, updateTime);
  });
  /* Bấm vào thanh để tua */
  document.getElementById('prog-wrap').addEventListener('click', function (e) {
    var d = song.duration;
    if (!isFinite(d) || d <= 0) return;
    var rect = this.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    song.currentTime = ratio * d;
  });
  updateTime();

  /* Màn hình "Welcome": bấm xong mới mở trang và bật nhạc */
  var gate = document.getElementById('gate');
  gate.addEventListener('click', function () {
    gate.classList.add('hide');
    setTimeout(function () { gate.style.display = 'none'; }, 700);
    setPlaying(true);
  });

  /* Dòng trạng thái tự gõ chữ */
  var st = document.getElementById('status');
  var full = st.textContent.trim();
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    var txt = document.createTextNode('');
    var caret = document.createElement('span');
    caret.className = 'caret';
    st.textContent = '';
    st.appendChild(txt);
    st.appendChild(caret);
    var n = 0, dir = 1;
    (function tick() {
      n += dir;
      txt.nodeValue = full.slice(0, n);
      var wait = 90;
      if (n >= full.length) { dir = -1; wait = 2200; }
      else if (n <= 0) { dir = 1; wait = 600; }
      else if (dir === -1) { wait = 45; }
      setTimeout(tick, wait);
    })();
  }
</script>
</body>
</html>
