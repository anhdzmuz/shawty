<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shawty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== ĐỔI TÊN FILE ẢNH Ở ĐÂY (png, jpg hoặc gif đều được) =====
   Upload file cùng thư mục với index.html, rồi sửa tên bên dưới cho khớp.
   Chưa có file thì trang tự dùng màu mặc định. */
:root{
  --accent:#FF6FA5;
  --page-bg:url("background.png");   /* ảnh/gif nền phía sau thẻ */
  --cover-bg:url("cover.png");       /* ảnh/gif nền phía sau avatar (dải trên cùng của thẻ) */
}
/* Ảnh avatar đổi ở dòng <img src="avatar.png"> trong phần HTML bên dưới */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08080E}
body{
  min-height:100vh;padding:40px 16px 56px;color:#F2F2F7;
  font-family:'Be Vietnam Pro',system-ui,sans-serif;line-height:1.55;
  background:var(--page-bg) center/cover no-repeat,radial-gradient(ellipse at 20% 0%,#2A1030 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#0F1F3A 0%,transparent 55%),#08080E;
  background-attachment:fixed;
}
.card{max-width:480px;margin:0 auto;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(18,18,28,.88);overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.1);font-family:'JetBrains Mono',monospace;font-size:14px;color:#8C8CA0}
.bar .ctl{display:flex;gap:16px}
.spin-star{display:block;animation:star-spin 4s linear infinite}
@keyframes star-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.cover{height:132px;background:var(--cover-bg) center/cover no-repeat,linear-gradient(135deg,var(--accent) 0%,#3A1F6B 55%,#0F1F3A 100%)}
.inner{padding:0 24px 28px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:12px;margin-top:-52px;position:relative;z-index:1}
.avatar{position:relative;overflow:hidden;width:104px;height:104px;border-radius:52px;border:4px solid #12121C;background:#1E1E2E;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:var(--accent)}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}
.user{font-family:'JetBrains Mono',monospace;font-size:14px;color:#A0A0B8}
.status{font-weight:600;font-size:15px;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pill{padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:14px}
.pill.mono{font-family:'JetBrains Mono',monospace;font-size:13px}
.badges{display:flex;gap:6px}
.avatar img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.badge{width:34px;height:34px;border-radius:17px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
p{margin:0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips .pill{padding:6px 14px}
.links{display:flex;flex-direction:column;gap:10px}
.link{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#F2F2F7;text-decoration:none;font-weight:500}
.link span.l{flex:1}
.link span.h{font-family:'JetBrains Mono',monospace;font-size:13px;color:#A0A0B8}
.link:hover{border-color:var(--accent)}
.music{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.play{width:48px;height:48px;border-radius:24px;border:none;background:var(--accent);color:#1A0A12;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.track{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.track b{font-weight:600;font-size:15px}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.15)}
.prog i{display:block;width:8%;height:4px;border-radius:2px;background:var(--accent)}
.time{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;color:#A0A0B8}
footer{text-align:center;font-size:12px;color:#8C8CA0;border-top:1px solid rgba(255,255,255,.1);padding-top:16px}

/* Chữ gradient chuyển động */
.gtext{
  display:inline-block;padding-bottom:.12em;
  background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:gshift 4s ease-in-out infinite;
}
@keyframes gshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.g-name{background-image:linear-gradient(90deg,#FF6FA5,#C77DFF,#8FA8FF,#C77DFF,#FF6FA5)}
.g-genshin{background-image:linear-gradient(90deg,#FFD27A,#FFF3C9,#7FD1FF,#FFF3C9,#FFD27A)}
.g-discord{background-image:linear-gradient(90deg,#6D79FF,#B4BCFF,#6D79FF,#B4BCFF,#6D79FF)}
.g-vn{background-image:linear-gradient(90deg,#FF2D2D,#FFD21F,#FF2D2D,#FFD21F,#FF2D2D);font-weight:700}
.g-tiktok{background-image:linear-gradient(90deg,#25F4EE,#FFFFFF,#FE2C55,#FFFFFF,#25F4EE)}

@media (prefers-reduced-motion:reduce){.spin-star,.gtext{animation:none}}
</style>
</head>
<body>
<div class="card">

  <div class="bar">
    <svg class="spin-star" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2l3 6.5 7 .9-5.1 4.9 1.3 7L12 17.8 5.8 21.3l1.3-7L2 9.4l7-.9z" fill="#FF6FA5" stroke="#FF6FA5" stroke-width="1.2" stroke-linejoin="round"/>
    </svg>
    <div class="ctl" aria-hidden="true"><span>–</span><span>□</span><span>✕</span></div>
  </div>

  <div class="cover"></div>

  <div class="inner">
    <header>
      <div class="avatar">G<img src="avatar.png" alt="Ảnh đại diện" onerror="this.style.display='none'"></div>
      <div>
        <h1><span class="gtext g-name">Shawty</span></h1>
        <div class="user">@hganh9128</div>
      </div>
      <div class="status">#lu hon loc xoay</div>
      <div class="row">
        <span class="pill mono"><span class="gtext g-vn">VN</span></span>
        <div class="badges">
          <span class="badge" role="img" aria-label="Lấp lánh">✨</span>
          <span class="badge" role="img" aria-label="Trái tim">💞</span>
          <span class="badge" role="img" aria-label="Suy nghĩ">💭</span>
          <span class="badge"><img src="cat.gif" alt="Mèo" width="30" height="30" style="display:block;object-fit:contain"></span>
        </div>
      </div>
    </header>

    <section>
      <h2>Giới thiệu</h2>
      <p>Cày thuê genshin impact , chạy roll , rush map..</p>
      <div class="chips">
        <span class="pill"><span class="gtext g-genshin">Genshin Impact</span></span>
      </div>
    </section>

    <section>
      <h2>Liên hệ</h2>
      <div class="links">
        <a class="link" href="#">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7B87FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M4 8h13v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8z"/></svg>
          <span class="l"><span class="gtext g-discord">Discord</span></span><span class="h"><span class="gtext g-discord">.HgAnh</span></span>
        </a>
        <a class="link" href="#">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#25F4EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
          <span class="l"><span class="gtext g-tiktok">TikTok</span></span><span class="h"><span class="gtext g-tiktok">@Shawty</span></span>
        </a>
      </div>
    </section>

    <section class="music">
      <button class="play" id="play" aria-label="Phát hoặc dừng nhạc">
        <svg id="ico-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg id="ico-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <div class="track">
        <b>[Tên bài hát]</b>
        <div class="prog"><i></i></div>
        <div class="time"><span>0:00</span><span>[0:00]</span></div>
      </div>
      <!-- Khi có file nhạc: <audio id="song" src="nhac.mp3" loop></audio> -->
    </section>

    <footer>following my heart wherever it leads.</footer>
  </div>
</div>

<script>
  /* Link chưa điền (href="#") thì bấm vào không làm gì, không nhảy lên đầu trang */
  document.querySelectorAll('a[href="#"]').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); });
  });

  var playing = false;
  var song = document.getElementById('song');
  document.getElementById('play').addEventListener('click', function () {
    playing = !playing;
    document.getElementById('ico-play').style.display = playing ? 'none' : 'block';
    document.getElementById('ico-pause').style.display = playing ? 'block' : 'none';
    if (song) { playing ? song.play() : song.pause(); }
  });
</script>
</body>
</html>
